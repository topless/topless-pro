name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Blocking gate covers only shipped dependencies; a new advisory in the
      # dev toolchain should not freeze unrelated PRs.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || true
      - run: npm run check
      - run: npm test
      - run: npm run build
